name: Install Aidoku CLI
description: Cache and install a pinned Aidoku CLI revision.

outputs:
  revision:
    description: Resolved Git revision installed by this action.
    value: ${{ steps.revision.outputs.revision }}

runs:
  using: composite
  steps:
    # pinned so a compromised or broken aidoku-rs HEAD can't reach the published list;
    # to update: git ls-remote https://github.com/Aidoku/aidoku-rs.git HEAD, test locally, paste here
    - name: Use pinned Aidoku CLI revision
      id: revision
      shell: bash
      run: echo "revision=ae6485e3c14ecd1fd5497d170eae884c68d04a87" >> "$GITHUB_OUTPUT"

    - name: Cache Aidoku CLI
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.local/aidoku-cli
        key: aidoku-cli-${{ runner.os }}-${{ steps.revision.outputs.revision }}

    - name: Add Aidoku CLI to PATH
      shell: bash
      run: echo "$HOME/.local/aidoku-cli/bin" >> "$GITHUB_PATH"

    - name: Install Aidoku CLI
      shell: bash
      env:
        AIDOKU_REVISION: ${{ steps.revision.outputs.revision }}
      run: |
        set -euo pipefail

        if [[ ! -x "$HOME/.local/aidoku-cli/bin/aidoku" ]]; then
          cargo install \
            --git https://github.com/Aidoku/aidoku-rs \
            --rev "$AIDOKU_REVISION" \
            --root "$HOME/.local/aidoku-cli" \
            aidoku-cli
        fi
